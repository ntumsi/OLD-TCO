services:
  # Application database (PostgreSQL + PostGIS) — use this instead of a local
  # PostgreSQL install. Matches the dev connection string in
  # AMCOS.Web.Core/appsettings.json (Host=localhost;Database=amcos;Username=postgres;Password=postgr3s).
  # PostGIS is required: migrations/000_schemas.sql runs CREATE EXTENSION postgis.
  amcos-db:
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.4}
    container_name: amcos-db
    environment:
      POSTGRES_DB: ${AMCOS_DB_NAME:-amcos}
      POSTGRES_USER: ${AMCOS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AMCOS_DB_PASSWORD:-postgr3s}
    ports:
      - "${AMCOS_DB_PORT:-5432}:5432"
    volumes:
      - amcos_db_data:/var/lib/postgresql/data
      # Mounted read-only so init.sh (migrations + seed) can be run inside the container.
      - ./AMCOS.PostgreSQL:/amcos-sql:ro
    healthcheck:
      # MUST probe over TCP (-h 127.0.0.1), not the unix socket. On first-time init the
      # postgres/postgis entrypoint runs a TEMPORARY socket-only server (listen_addresses='')
      # to create the database and run init scripts, then restarts with TCP. A socket-based
      # pg_isready reports "ready" during that window, so amcos-db-init would start before the
      # real server accepts TCP — and die, leaving the database un-migrated/un-seeded. This is
      # why a brand-new environment failed to seed while an existing volume worked.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${AMCOS_DB_USER:-postgres} -d ${AMCOS_DB_NAME:-amcos}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # One-shot database initialiser. Waits for amcos-db to be healthy, then applies
  # every migration and seed file via AMCOS.PostgreSQL/init.sh — but ONLY when the
  # AMCOS schema is not already present (guard query below), so it is a no-op on
  # subsequent `up`s and never fails against an already-populated database. This
  # removes the previously manual `docker compose exec amcos-db bash /amcos-sql/init.sh`
  # step, so `docker compose up` leaves Postgres migrated + seeded and ready to use.
  amcos-db-init:
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.4}
    container_name: amcos-db-init
    environment:
      PGHOST: amcos-db
      PGPORT: "5432"
      PGUSER: ${AMCOS_DB_USER:-postgres}
      PGPASSWORD: ${AMCOS_DB_PASSWORD:-postgr3s}
      PGDATABASE: ${AMCOS_DB_NAME:-amcos}
    volumes:
      - ./AMCOS.PostgreSQL:/amcos-sql:ro
    depends_on:
      amcos-db:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        # $$ escapes compose interpolation so the shell sees a single $.

        # Belt-and-braces readiness wait. The healthcheck already probes TCP, but retry here
        # too so a slow first-time initdb can never leave the database un-seeded.
        for i in $$(seq 1 60); do
          if psql -tAc "SELECT 1" >/dev/null 2>&1; then break; fi
          echo "waiting for amcos-db to accept connections ($$i/60)..."
          sleep 2
        done
        if ! psql -tAc "SELECT 1" >/dev/null 2>&1; then
          echo "ERROR: amcos-db never became reachable over TCP; not seeding." >&2
          exit 1
        fi

        tables=$$(psql -tAc "SELECT count(*) FROM pg_tables WHERE schemaname IN ('lookup','data','webuser','web','warehouse')")
        tables=$${tables//[[:space:]]/}
        # Seed marker: lookup.amcosversion is populated by seed/001. Missing table -> 0.
        seeded=$$(psql -tAc "SELECT count(*) FROM lookup.amcosversion" 2>/dev/null || echo 0)
        seeded=$${seeded//[[:space:]]/}

        if [ "$$tables" -gt 0 ] && [ "$$seeded" -gt 0 ]; then
          echo "AMCOS schema present ($$tables tables, $$seeded versions seeded) - nothing to do."
        elif [ "$$tables" -gt 0 ]; then
          # Don't silently skip: a table-count-only guard would hide this forever.
          echo "ERROR: amcos has $$tables tables but no seed data - the database is half-initialised" >&2
          echo "       (a previous init run failed part-way). Migrations are not re-runnable," >&2
          echo "       so reset the volume and bring it up again:" >&2
          echo "         docker compose down -v && docker compose up" >&2
          exit 1
        else
          echo "Empty database detected - applying migrations and seed data..."
          bash /amcos-sql/init.sh --host amcos-db
          echo "Migrations + seed complete."
        fi

  keycloak-db:
    image: ${KEYCLOAK_DB_IMAGE:-postgres:16-alpine}
    container_name: amcos-keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot realm importer. Runs BEFORE Keycloak starts and (re)imports every
  # realm JSON in ./keycloak with --override=true, so the `cave` realm and its
  # `amcos-local` client are synced from keycloak/cave-realm.json on EVERY
  # `docker compose up` — even when keycloak_db_data already exists or the realm
  # file was edited. This replaces the start-time `--import-realm` flag, which
  # only imports on a first boot against an empty DB and silently skips an
  # existing realm (the cause of the "Client not found" error on a dirty volume).
  keycloak-config:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.2}
    container_name: amcos-keycloak-config
    command:
      - import
      - --dir=/opt/keycloak/data/import
      - --override=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
      # This container initializes the empty DB (and the master realm) first, so it
      # must carry the bootstrap admin credentials — otherwise master is created with
      # no admin and the later start-dev skips admin creation.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.2}
    container_name: amcos-keycloak
    command:
      - start-dev
    environment:
      # Bootstrap admin for the master realm / admin console. Keycloak 26 replaced
      # KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD with KC_BOOTSTRAP_ADMIN_*; the old
      # names are silently ignored on 26.x, which left the console with no usable
      # admin account (login as admin/admin failed).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}

      # Serve under /auth to match the existing Authority URL path (/auth/realms/cave)
      KC_HTTP_RELATIVE_PATH: /auth

      # Hostname (used for token issuer). Must match the published port so browser-facing
      # issuer URLs are reachable; keep KC_HOSTNAME_PORT == KEYCLOAK_HTTP_PORT.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: "${KEYCLOAK_HTTP_PORT:-8180}"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"

      # HTTP (no TLS for local dev)
      KC_HTTP_ENABLED: "true"

      # Expose /health/ready so `docker compose up --wait` can block until login is actually up.
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8180}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
      # Do not start until the realm/client import has completed successfully,
      # so Keycloak never comes up serving a realm without the amcos-local client.
      keycloak-config:
        condition: service_completed_successfully
    healthcheck:
      # The Keycloak image ships no curl/wget; use bash's /dev/tcp to confirm the
      # HTTP port is accepting connections (kc.sh runs on bash, so it is present).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  amcos_db_data:
  keycloak_db_data:
